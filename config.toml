# ─────────────────────────────────────────────────────────────
#  K-beauty 자동 게시 봇 설정
#  '#' 뒤는 설명이에요. 따옴표 안의 값만 바꾸면 됩니다.
# ─────────────────────────────────────────────────────────────

[account]
handle = "seoul.skin.picks"                       # 인스타 아이디 (@ 빼고)
brand_name = "Seoul Skin Picks"                   # 링크 페이지 제목
tagline = "Real K-beauty picks, chosen in Korea"  # 링크 페이지 한 줄 소개
timezone = "Asia/Seoul"                           # 날짜 기준 시간대

[schedule]
# 요일별로 올릴 종류 (월 화 수 목 금 토 일 순서, 한국 날짜 기준). 정보가 주, 제품은 곁들이는 방향.
#   skin_korea  : 피부 성분 101 — 한국에서 뜨는 성분 먼저 (예: PDRN, 쑥, 판테놀)
#   skin_global : 피부 성분 101 — 해외에서 뜨는 성분 먼저 (예: NAD+, 달팽이, TXA)
#   skin        : 피부 성분 101 — 순서대로 아무거나
#   hair        : 모발·두피 성분 101 (예: 로즈마리, LPP, 두피 스케일링)
#   weekly      : 이번 주 K뷰티 TOP — 네이버 검색 성분 TOP10 + 올리브영 글로벌 베스트셀러 TOP10 (우리 링크)
#   versus      : 서울 vs 해외 — 조사해 둔 비교 (weekly 데이터가 없을 때 대신 올라가요)
#   history     : K뷰티 타임머신 — 연도별로 뭐가 유행했는지 (처음엔 전체 타임라인)
#   product     : 제품 픽 (아래 mode 순서로 K뷰티 / 알리 도구)
# 성분·비교 글에도 그 성분이 들어간 올리브영 인기 제품이 자동으로 붙어요.
# 내용은 content/ 폴더의 skin.toml · hair.toml · trends.toml (조사·출처 확인한 자료)에서 가져와요.
weekly = ["skin_korea", "product", "hair", "weekly", "skin_global", "history", "product"]
repeat_after_days = 120   # 정보 글을 다 쓰면, 올린 지 이 날짜가 지난 것부터 다시 올려요

# 제품 픽 날의 순서:
# alternate     : K뷰티와 알리 도구를 번갈아 (한쪽이 비면 다른 쪽)
# kbeauty_first : K뷰티 목록이 남아 있으면 항상 K뷰티, 비면 알리 도구
# tools_first   : 알리 도구 우선, 안 되면 K뷰티
mode = "alternate"

[kbeauty]
# 구글 시트를 '웹에 게시 → CSV'로 만든 주소.
# 비워두면 GitHub Secret KBEAUTY_SHEET_CSV_URL → 없으면 data/kbeauty_queue.csv 순서로 읽어요.
sheet_csv_url = ""
shop_name = "Olive Young Global"                  # 마지막 장 "Shop at ..." 문구
review_source = "Olive Young"                     # 평점·리뷰 출처 표시 ("... reviews on Olive Young")
auto_find_aliexpress = true   # 알리 주소 칸이 비어 있으면 브랜드 공식 스토어에서 같은 제품을 자동으로 찾아봐요 (끄려면 false)
# 올리브영 글로벌 제휴에 가입한 뒤, 제휴 링크 모양에 맞춰 바꾸세요.
# {url} = 상품 주소, {prdt_no} = 상품 번호.  예: "{url}&referral=MYCODE"
oliveyoung_link_template = "{url}"
oliveyoung_code = ""          # 제휴 코드(리워드 코드)가 있으면 적어요 → 캡션·링크 페이지에 "Use code ..." 표시

[discover]
# 매주 월요일 올리브영 글로벌 베스트셀러를 모아서 알리 공식 스토어에 있는지 확인하고
# data/auto_queue.csv 에 자동으로 넣어요. (내 구글 시트에 적은 제품이 항상 먼저 올라가요)
enabled = true
lists = ["Skincare", "Suncare", "Face Masks"]   # 추가 가능: "Makeup", "Hair", "Bath & Body"
top_n = 20          # 목록마다 상위 몇 위까지 볼지
max_new = 10        # 한 번에 새로 추가할 최대 개수
min_rating = 4.5    # 평점 이보다 낮으면 제외
min_reviews = 30    # 리뷰 수 이보다 적으면 제외
skip_brands = []    # 빼고 싶은 브랜드 (예: ["BRAND A"])
# 성분 글의 '어디서 사나' 카드용으로 저장할 베스트셀러 목록 (data/oy_catalog.json)
catalog_lists = ["Skincare", "Suncare", "Face Masks", "Hair"]
catalog_top_n = 100

[research]
# 매달 28일 제미나이가 새 주제 초안을 content/drafts/ 에 만들어요. (게시되지 않아요)
# 매달 1일 Claude가 그 초안을 사실 확인해서 점수를 매기고, 자기 조사와 비교해요.
free_mode = true          # 무료: 올리브영 베스트셀러 + 위키백과 + PubMed 자료로만 쓰기 (GEMINI_API_KEY)
# 구글 검색 방식은 꺼둬요: 제미나이 약관상 구글 검색 결과는 저장·수정·재게시할 수 없고, 질문한 사람에게
# 검색 추천과 함께 보여주는 용도로만 쓸 수 있어요 (Gemini API Additional Terms, "Grounding with Google Search").
search_mode = false
# 초안을 실제 자료(content/*.toml)에 넣을지:
#   never    : 넣지 않음 (초안만)
#   fallback : Claude나 내가 content/ 를 fallback_after_days 동안 안 고쳤으면 (예: 구독 해지) 자동 검사 통과한 것만 넣음
#   always   : 매달 자동 검사 통과한 것을 바로 넣음
auto_add = "fallback"
fallback_after_days = 40
max_skin = 6
max_hair = 3

[aliexpress]
ship_to_country = "US"      # 가격·배송 기준 국가 (US, GB, AU, CA ...)
currency = "USD"
language = "EN"
max_price_usd = 25          # 이 가격 넘는 상품은 제외
min_rating_percent = 90     # 긍정 리뷰 비율이 이보다 낮으면 제외
min_orders = 200            # 판매량이 이보다 적으면 제외
# 돌아가며 찾을 도구 종류 (bot/knowledge.py 의 TOOLS 이름). 빼고 싶은 건 지우면 돼요.
tools = [
  "gua_sha", "ice_roller", "face_roller", "silicone_scrubber", "mask_brush",
  "makeup_sponge", "brush_set", "spa_headband", "konjac_sponge",
  "scalp_massager", "eyelash_curler", "reusable_pads",
]
extra_blocked_words = []    # 추가로 걸러낼 단어 (예: ["unicorn", "cartoon"])

[copy]
# AI가 카피를 다듬고 한국어 한줄평을 영어로 번역해요. 아래 순서로 시도하고, 모두 실패하면 내장 템플릿으로 게시해요.
#  - claude : ANTHROPIC_API_KEY (유료, 키를 넣었을 때만)
#  - gemini : GEMINI_API_KEY (Google AI Studio 무료 키)
#  - backup : BACKUP_AI_KEY (백업 AI — 기본은 Groq 무료 키. OpenAI 호환 API면 아래 주소·모델만 바꿔서 다른 곳도 가능)
ai_order = ["claude", "gemini", "backup"]
retry_delays = [5, 60, 300]            # 일시 오류일 때 다시 시도하는 간격(초): 5초 → 1분 → 5분, 그래도 안 되면 다음 AI
gemini_model = "gemini-flash-latest"   # 보통 그대로 두세요. 안 되면 자동으로 다른 Flash 모델로 바꿔 시도해요.
backup_ai_name = "Groq"
backup_ai_url = "https://api.groq.com/openai/v1/chat/completions"
backup_ai_model = "openai/gpt-oss-120b"
ai_model = "claude-haiku-4-5-20251001"
hashtags_common = ["#kbeauty", "#koreanskincare", "#skincareroutine", "#kbeautytips", "#seoulbeauty"]
hashtags_kbeauty = ["#oliveyoung", "#oliveyoungglobal", "#kbeautyfavorites", "#koreanbeauty"]
hashtags_tools = ["#skincaretools", "#selfcaretools", "#aliexpressfinds", "#beautytools"]

[pinterest]
# 핀터레스트 비즈니스 계정 → 설정 → 소유권 확인(Claimed accounts) → 웹사이트 → "HTML 태그" 에서
# content="..." 안의 값만 복사해서 넣으세요. 링크 페이지에 인증 태그가 자동으로 들어가요.
domain_verify = "c27d4dbaf78a403d088508fcd4693e47"
# 보통 비워두세요 (GitHub가 자동으로 알려줘요). 직접 도메인을 쓰면 적어요: "https://example.com/"
site_url = ""

[instagram]
# 'Instagram 로그인' 방식 API (페이스북 페이지 불필요). 보통은 그대로 두세요.
api_host = "graph.instagram.com"
api_version = "v24.0"
