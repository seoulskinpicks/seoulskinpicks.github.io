name: Daily post

on:
  schedule:
    # 밤: 13:07 UTC = 한국 22:07 · 미국 동부 09:07 · 영국 14:07 (릴스는 이때만)
    # 아침: 00:07 UTC = 한국 09:07 · 미국 동부 20:07 (config.toml posts_per_day = 2 일 때만 게시, 1이면 그냥 건너뛰어요)
    # (GitHub 사정으로 10~30분 늦게 시작될 수 있어요)
    - cron: "7 13 * * *"
    - cron: "7 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "미리보기만 (체크하면 인스타에 올리지 않고 카드 이미지만 만들어요)"
        type: boolean
        default: true
      source:
        description: "올릴 종류 (auto = config [series] 계획대로 · 나머지 = 그 종류로 · site = 링크 페이지만)"
        type: choice
        options: [auto, weekly, skin, hair, routine, myth, combo, season, words, recap, industry, versus, history, product, kbeauty, tools, site]
        default: auto
      reel:
        description: "릴스 (auto = config [reels] 요일대로 · yes = 오늘 릴스도 · no = 카드뉴스만)"
        type: choice
        options: [auto, "yes", "no"]
        default: auto

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # AI 재시도(5초·1분·5분) + 릴스 영상 처리(최대 15분) 여유 포함
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Get site address
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare today's post
        id: prepare
        env:
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKUP_AI_KEY: ${{ secrets.BACKUP_AI_KEY }}
          KBEAUTY_SHEET_CSV_URL: ${{ secrets.KBEAUTY_SHEET_CSV_URL }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          SLOT=evening
          if [ "${{ github.event.schedule }}" = "7 0 * * *" ]; then SLOT=morning; fi
          ARGS="--out site --source ${{ inputs.source || 'auto' }} --reel ${{ inputs.reel || 'auto' }} --slot $SLOT"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m bot prepare $ARGS

      - name: Check connections (preview runs only)
        if: env.DRY_RUN == 'true'
        continue-on-error: true
        env:
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKUP_AI_KEY: ${{ secrets.BACKUP_AI_KEY }}
          KBEAUTY_SHEET_CSV_URL: ${{ secrets.KBEAUTY_SHEET_CSV_URL }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m bot check

      - name: Keep card images for review
        if: steps.prepare.outputs.has_post == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-images
          path: |
            site/posts
            site/pins
            site/reels
            pins/*.jpg
          retention-days: 14

      - name: Upload link page + images
        if: steps.prepare.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.prepare.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4

      - name: Publish to Instagram
        if: steps.prepare.outputs.has_post == 'true' && env.DRY_RUN != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m bot publish --site-url "${{ steps.deployment.outputs.page_url }}"

      - name: Save progress
        if: always() && steps.prepare.outputs.has_post == 'true' && env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json pins
          if [ -f data/trend_latest.json ]; then git add data/trend_latest.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update posting state (No.${{ steps.prepare.outputs.number }})"
          git pull --rebase --autostash
          git push
