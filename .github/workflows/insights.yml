name: Instagram insights

# 매일 밤 게시 1시간쯤 뒤에 최근 30일 게시물의 조회·도달·저장 수를 가져와요.
# 결과는 이 실행 기록의 요약(Summary)에 표로 나오고, data/insights.json 에 날짜별로 쌓여요.
# 언제든 Actions → Instagram insights → Run workflow 로 바로 볼 수도 있어요.
on:
  schedule:
    - cron: "37 14 * * *"   # 한국 23:37
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Get insights
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m bot insights

      - name: Save history
        run: |
          [ -f data/insights.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/insights.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Instagram insights $(date -u +%F)"
          git pull --rebase --autostash
          git push
