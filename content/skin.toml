[[ingredient]]
id = "pdrn"
name = "PDRN"
full_name = "Polydeoxyribonucleotide"
nickname = "Salmon DNA"
area = "skin"
heat = "both"
heat_note = "Olive Young searches +695% YoY (Sept 2025)"
hot_since = 2024
hook = "Salmon DNA in your serum? Here's the real story"
what_it_is = "PDRN is a purified blend of DNA fragments, usually from salmon. It started in clinic injections and is now one of K-beauty's most popular serum ingredients."
origin = "Mostly salmon sperm cells; some brands use plant DNA"
benefits = [
  "Helps skin feel hydrated, bouncy and comfortable",
  "Supports a calm, healthy-looking skin barrier",
  "May help skin look smoother and more radiant",
]
best_for = ["Dull or tired-looking skin", "Dry, dehydrated skin", "Early fine lines"]
when = "AM & PM"
how_to_use = [
  "Apply after toner, on slightly damp skin",
  "Pat in 2–3 drops gently; no need to rub",
  "Seal with moisturizer; add SPF in the morning",
]
pairs_with = ["Hyaluronic acid", "Peptides", "Niacinamide"]
avoid_with = []
good_to_know = [
  "Most PDRN research is on injections; serum results are gentler and less studied.",
  "Usually salmon-derived: skip it or patch test first if you have a fish allergy.",
  "Labels list it as 'Sodium DNA', and some 'PDRN' is plant-derived. Check the source.",
]
myth = "A PDRN serum works like a PDRN or Rejuran injection."
fact = "Injections place DNA fragments deep in skin. Serums stay near the surface: think hydration, not a procedure."
