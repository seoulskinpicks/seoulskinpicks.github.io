  {brand = "Cell Fusion C", product = "Salmon PDRN Ampoule"},
]
hashtags = ["#pdrn", "#salmondna", "#pdrnskincare", "#kbeauty"]
sources = [
  "https://newsroom.cj.net/k-beauty-trends-highlights-from-latest-olive-young-sale/",
  "https://jcasonline.com/polynucleotides-and-polydeoxyribonucleotides-in-dermatology-a-narrative-review/",
  "https://chemistconfessions.com/blogs/pdrn-skincare-hype-vs-reality",
  "https://cosmeticsbusiness.com/same-inci-different-origins-why-pdrn-sourcing-matters",
