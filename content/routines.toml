[[routine]]
id = "oily-scalp"
area = "hair"
concern = "Oily, flaky scalp"
title = "The scalp reset routine"
hook = "Treat your scalp like the skin it is"
why = "An oily, flaky scalp likes regular washing, gentle exfoliation and a light hand with heavy products at the roots."
am = [
  "Wash in the evening if you sweat a lot during the day",
  "Menthol or cooling scalp spray on hot days",
  "Keep heavy oils and butters off the roots",
]
pm = [
  "Brush dry hair to loosen buildup",
  "Shampoo twice: first to cleanse, then to treat",
  "1–2x a week: salicylic acid scalp scaler",
  "Conditioner on lengths only",
  "Dry the scalp fully before bed",
]
key = ["salicylic-acid", "menthol", "rosemary"]
tips = [
  "Thick yellow flakes, redness or itching that won't settle: see a dermatologist.",
  "Scrubbing hard with nails irritates the scalp more.",
]

[[routine]]
id = "damaged-hair"
area = "hair"
concern = "Bleached, frizzy lengths"
title = "The repair routine"
hook = "Lengths can't heal, but they can be protected"
why = "Hair lengths are non-living, so care means filling damage, adding slip and preventing new damage from heat and friction."
am = [
  "Leave-in with panthenol on damp lengths",
  "Heat protectant before any hot tool",
  "A drop of argan oil on the ends",
]
pm = [
  "Gentle shampoo on the scalp only",
  "Conditioner on mid-lengths to ends",
  "1–2x a week: LPP protein treatment",
  "Towel-blot, don't rub",
  "Silk or satin pillowcase for less friction",
]
key = ["lpp-protein", "argan-oil", "dexpanthenol"]
tips = [
  "Turn hot tools down; very high heat damages hair faster.",
  "A trim is the only true fix for split ends.",
]
